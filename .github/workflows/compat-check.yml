name: qingcha-cloud-compat-check

on:
  workflow_dispatch:
  schedule:
    - cron: "0 3 * * *" # 每天一次,盯住 mihomo 新版本对清茶云配置写法的解析回归
  push:
    paths:
      - "compat_test/**"
      - "compat/**"
      - "lib/**"
      - ".github/workflows/compat-check.yml"

jobs:
  compat:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Syntax-check shipped fix script
        run: node --check compat/qingcha-mobile-fix.js

      - name: Run qingcha cloud compat matrix
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python compat_test/check_compat.py
